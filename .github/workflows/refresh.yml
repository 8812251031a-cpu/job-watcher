name: Weekly health report

# Re-checks every firm in config/firms.yaml and writes data/report.json.
# Also runs whenever the config or the watcher code changes. Trackr is not used.
on:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/**", "watcher/**"]

permissions:
  contents: write
  issues: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Check every firm and write the health report
        run: python watcher/watch.py --report
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "job-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git commit -m "Weekly health report" || exit 0
          git pull --rebase && git push
