name: Refresh firm list

on:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/overrides.json", "watcher/**"]

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Rebuild firm database
        run: python watcher/build_firms.py
      - name: Health report
        run: python watcher/watch.py --report
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          date -u +"%Y-%m-%dT%H:%MZ" > data/last_refresh.txt
          git config user.name "job-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Weekly firm list refresh" || exit 0
          git pull --rebase && git push
