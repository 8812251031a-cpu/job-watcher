name: One-time Trackr import

# Manual only. Writes config/firms.yaml and archive/trackr/. Nothing runs this on a schedule.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Import
        run: python tools/import_trackr.py
      - name: Commit
        run: |
          git config user.name "job-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config archive
          git commit -m "Import firm list from Trackr into config/firms.yaml [skip ci]" || exit 0
          git pull --rebase && git push
