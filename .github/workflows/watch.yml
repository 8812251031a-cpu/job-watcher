name: Watch job sites

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      report:
        description: "Also write the per-firm health report"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Check every firm
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python watcher/watch.py ${{ inputs.report && '--report' || '' }}
      - name: Save what has been seen
        run: |
          git config user.name "job-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Update seen postings" && git pull --rebase && git push
          fi
