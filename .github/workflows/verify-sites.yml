name: Verify career sites

# Manual. Opens every firm's careers pages in a browser, confirms each job board
# answers, and updates config/firms.yaml with the boards the firms actually use.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt playwright==1.47.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify
        run: python tools/verify_sites.py
      - name: Commit
        run: |
          git config user.name "job-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A config archive data/quiet_next_run
          git commit -m "Verify career sites against each firm's own pages" || exit 0
          git pull --rebase && git push
